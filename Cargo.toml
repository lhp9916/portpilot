[package]
name = "portpilot"
version = "0.1.0"
edition = "2024"
description = "A cross-platform local TCP/UDP port forwarding desktop app"
build = "build.rs"

[lib]
name = "portpilot"
path = "src/lib.rs"

[[bin]]
name = "portpilot"
path = "src/main.rs"

[dependencies]
auto-launch = "0.6.0"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.37.0"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
muda = "0.21.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
single-instance = "0.3.3"
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.20"
tray-icon = "0.26.1"
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winres = "0.1.12"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

