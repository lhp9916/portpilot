name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact: portpilot-windows-x64
            binary: target/release/portpilot.exe
          - name: macos-arm64
            os: macos-14
            artifact: portpilot-macos-arm64
            binary: target/release/portpilot
          - name: linux-x64
            os: ubuntu-22.04
            artifact: portpilot-linux-x64
            binary: target/release/portpilot

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux window and tray dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Validate tag matches Cargo version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v$version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: portpilot-windows-x64
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: portpilot-macos-arm64
          path: artifacts/macos

      - uses: actions/download-artifact@v4
        with:
          name: portpilot-linux-x64
          path: artifacts/linux

      - name: Package release archives
        run: |
          set -euo pipefail
          mkdir -p staging/windows staging/macos staging/linux dist

          cp artifacts/windows/portpilot.exe staging/windows/
          cp README.md staging/windows/

          cp artifacts/macos/portpilot staging/macos/
          cp README.md staging/macos/
          chmod +x staging/macos/portpilot

          cp artifacts/linux/portpilot staging/linux/
          cp README.md staging/linux/
          chmod +x staging/linux/portpilot

          (cd staging/windows && zip -q -r "../../dist/portpilot-${GITHUB_REF_NAME}-windows-x64.zip" .)
          tar -czf "dist/portpilot-${GITHUB_REF_NAME}-macos-arm64.tar.gz" -C staging/macos .
          tar -czf "dist/portpilot-${GITHUB_REF_NAME}-linux-x64.tar.gz" -C staging/linux .
          (cd dist && sha256sum portpilot-* > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          PortPilot 是一个使用 Rust 和 egui 构建的跨平台本地 TCP/UDP 端口转发桌面工具。

          ## 下载

          - Windows x64 便携版：`portpilot-<tag>-windows-x64.zip`
          - macOS ARM64：`portpilot-<tag>-macos-arm64.tar.gz`
          - Linux x64：`portpilot-<tag>-linux-x64.tar.gz`
          - 校验文件：`SHA256SUMS.txt`

          ## 说明

          - Windows、macOS 和 Linux 产物均由该标签对应提交的 GitHub Actions 构建并通过测试。
          - 发布产物未进行代码签名；macOS 和 Linux 二进制首次运行前可能需要设置执行权限或解除隔离标记。
          - 支持 TCP/UDP 本地端口转发、双语界面、托盘、开机自启、日志和流量统计。
          - 当前首版不包含 SSH 隧道、反向转发、UDP 组播/广播。
          EOF
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "PortPilot ${GITHUB_REF_NAME}" --notes-file release-notes.md --latest
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "PortPilot ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --latest
          fi

